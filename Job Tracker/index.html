<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img id="logo" src="assets/trackly_logo.png" alt="trackly_logo">
        <div class="navlinks">
        <a href="#home">Home</a>
        <a href="#new">New</a>
        <a href="#list">List</a>
        </div>
    </div>

    <div id="main_body">

        <h2>Hi jagpreet</h2>
        <h6>Ready for surprising career!</h6>


        <div id="new_job">
            <form  id="new_tracking" action="POSR">
                
                <input type="text" name="Title" id="title" placeholder="Title">
                <input type="text" name="short Description" id="short_description" placeholder="short_description">
                <input type="text" name="company name" id="company_name" placeholder="company_name">
                <input type="text" name="Job Title" id="job_title">
                <select name="status" id="status">
                    <option value="applied">Applied</option>
                    <option value="planning">Planning</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button id="addJobBtn">Add Job</button>

            </form>
        </div>

    </div>
    
</body>
</html>
