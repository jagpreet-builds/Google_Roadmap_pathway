<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card_bg">

        <div class="card_body">
            <img id="profile" class="profile" src="assets/profile.png" alt="">


            <h1 >Jagpreet Singh</h1>
            <h3 id="position">Full Stack AI Developer</h3>
            <h3 id="Contact"></h3>


            <p>I build modern websites and Ai powered tools</p>

            <div class="skills_badge">
                <img src="assets/html.png" alt="html logo">
                <img src="assets/css.png" alt="Css logo">
                <img src="assets/ai.png" alt="Ai logo">

            </div>

            <div class="buttons">
            <button>View work</button>
            <button id="show_contact">Contact</button>
            <button id="change_pos">Magic</button>
            <button id="smileBtn">Make me smile</button>
            <button id="reset">Reset</button>
            <button id="theme">Dark Mode</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
